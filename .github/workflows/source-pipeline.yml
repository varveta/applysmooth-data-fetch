name: Source pipeline runner
on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      mode:
        required: false
        default: auto
        type: string
permissions:
  contents: read
jobs:
  collect:
    if: github.repository == 'varveta/applysmooth-data-fetch' && github.ref == 'refs/heads/main'
    concurrency:
      group: collector-online
      cancel-in-progress: false
      queue: max
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Collect and validate this source
        run: pnpm exec tsx ingest/source-pipeline.ts "$SOURCE"
        env:
          SOURCE: ${{ inputs.source }}
          COLLECTOR_SOURCE_MODE: ${{ inputs.mode }}
          COLLECTOR_ACTIVE_SOURCES: ${{ vars.JOBS_ACTIVE_SOURCES || '[]' }}
          COLLECTOR_SOURCE_NOT_BEFORE: ${{ vars.JOBS_SOURCE_NOT_BEFORE || '{}' }}
          COLLECTOR_ENDPOINT: ${{ secrets.COLLECTOR_ENDPOINT }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          COLLECTOR_VERCEL_BYPASS: ${{ secrets.COLLECTOR_VERCEL_BYPASS }}
      - name: Save per-source validation summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-${{ inputs.source }}-${{ github.run_id }}
          path: ingest/data/source-*.json
          if-no-files-found: warn
          retention-days: 7
