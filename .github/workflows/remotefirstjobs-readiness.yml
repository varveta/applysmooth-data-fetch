name: Remote First Jobs readiness
on:
  pull_request:
    paths:
      - '.github/workflows/remotefirstjobs-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify public source and every accepted application link without database access
        run: pnpm exec tsx ingest/verify-preview.ts ingest/config/expansion-next-batch.json remotefirstjobs > readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remotefirstjobs-readiness
          path: readiness.json
          retention-days: 14
