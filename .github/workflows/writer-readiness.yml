name: Writer readiness (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: writer-readiness-diagnostic
  cancel-in-progress: false
jobs:
  readiness:
    if: github.repository == 'varveta/applysmooth-data-fetch' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Check existing writer identity-read access only
        run: pnpm exec tsx ingest/writer-readiness.ts
        env:
          COLLECTOR_ACTIVE_SOURCES: ${{ vars.JOBS_ACTIVE_SOURCES || '[]' }}
          COLLECTOR_ENDPOINT: ${{ secrets.COLLECTOR_ENDPOINT }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          COLLECTOR_VERCEL_BYPASS: ${{ secrets.COLLECTOR_VERCEL_BYPASS }}
