name: Collector
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        type: choice
        options: [rehearsal, publish]
        default: rehearsal
permissions:
  contents: read
concurrency:
  group: collector-${{ github.event_name == 'pull_request' && github.ref || 'online' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck
  rehearsal:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rehearsal'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm rehearsal
  publish:
    if: github.repository == 'varveta/applysmooth-data-fetch' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    needs: test
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx ingest/scheduled.ts
        env:
          COLLECTOR_ENDPOINT: ${{ secrets.COLLECTOR_ENDPOINT }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          COLLECTOR_VERCEL_BYPASS: ${{ secrets.COLLECTOR_VERCEL_BYPASS }}
      - name: Notify external dead-man monitor
        if: always()
        env:
          MONITOR_PING_URL: ${{ secrets.MONITOR_PING_URL }}
          RESULT: ${{ job.status }}
        run: |
          if [ -n "$MONITOR_PING_URL" ]; then
            suffix=""
            if [ "$RESULT" != success ]; then suffix="/fail"; fi
            curl --fail --silent --max-time 15 --retry 2 "$MONITOR_PING_URL$suffix" > /dev/null 2>&1 || { echo "Monitor ping failed"; exit 1; }
          fi

# Add schedule: [{cron: '17 10 * * *'}] and allow schedule in publish condition
# only after controlled online validation and independent 36-hour monitoring pass.
