name: Collector
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        type: choice
        options: [rehearsal, publish]
        default: rehearsal
permissions:
  contents: read
concurrency:
  group: collector-${{ github.event_name == 'pull_request' && github.ref || 'online' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck
  rehearsal:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rehearsal'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm rehearsal
  publish:
    if: github.repository == 'varveta/applysmooth-data-fetch' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    needs: test
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Start Sentry check-in
        id: monitor-start
        env:
          SENTRY_CRON_URL: ${{ secrets.SENTRY_CRON_URL }}
        run: node ingest/monitor.mjs start
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Restore encrypted runner cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ingest/data/runner-cache.bin
          key: collector-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: collector-encrypted-v1-
      - run: pnpm exec tsx ingest/scheduled.ts
        env:
          COLLECTOR_CACHE_KEY: ${{ secrets.COLLECTOR_CACHE_KEY }}
          COLLECTOR_ENDPOINT: ${{ secrets.COLLECTOR_ENDPOINT }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          COLLECTOR_VERCEL_BYPASS: ${{ secrets.COLLECTOR_VERCEL_BYPASS }}
      - name: Save encrypted runner cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ingest/data/runner-cache.bin
          key: collector-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Complete Sentry check-in
        if: always() && steps.monitor-start.outcome == 'success'
        env:
          SENTRY_CRON_URL: ${{ secrets.SENTRY_CRON_URL }}
          COLLECTOR_RESULT: ${{ job.status }}
        run: node ingest/monitor.mjs finish

# Activation gate: add schedule [{cron: '17 4,10,16,22 * * *'}] and permit
# schedule in publish only after cloud drills and recipient email delivery pass.
