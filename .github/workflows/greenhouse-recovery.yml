name: Greenhouse recovery
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate or publish Greenhouse while its scheduled workflow is paused
        type: choice
        options: [dry-run, publish]
        default: dry-run
      board:
        description: Recover all boards or only the incomplete Asana board
        type: choice
        options: [all, asana]
        default: all
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'varveta/applysmooth-data-fetch' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/source-pipeline.yml
    with:
      source: greenhouse
      mode: ${{ inputs.mode }}
      recovery_tenant: ${{ inputs.board == 'asana' && 'asana' || '' }}
    secrets: inherit
