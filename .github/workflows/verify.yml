name: Verify jobs
on:
  workflow_dispatch:
  # Enable only after TEST acceptance and explicit schedule approval.
  # schedule:
  #   - cron: '47 6 * * *'
permissions:
  contents: read
concurrency:
  group: verify
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'varveta/applysmooth-data-fetch' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck
      - name: Verify queued jobs and report classifications
        run: pnpm exec tsx ingest/verify.ts
        env:
          COLLECTOR_ENDPOINT: ${{ secrets.COLLECTOR_ENDPOINT }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          COLLECTOR_VERCEL_BYPASS: ${{ secrets.COLLECTOR_VERCEL_BYPASS }}
