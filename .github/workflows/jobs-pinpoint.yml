name: TEST Jobs - pinpoint
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'varveta/applysmooth-data-fetch' && github.ref == 'refs/heads/TEST'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Fetch and validate Pinpoint without database writes
        run: pnpm exec tsx ingest/validate-targets.ts ingest/config/expansion-test.json pinpoint
      - name: Save TEST validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-validation-test-pinpoint-${{ github.run_id }}
          path: ingest/data/source-validation-test-pinpoint.json
          if-no-files-found: warn
          retention-days: 14
